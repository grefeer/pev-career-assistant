server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html is the SPA entry point and changes on every deploy (it pins the
    # hashed asset URLs). A stale copy keeps the browser on old assets, so it must
    # always be revalidated. Hashed /assets/* stay implicitly cacheable: their
    # filenames change with content, so a fresh index.html always points at them.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
