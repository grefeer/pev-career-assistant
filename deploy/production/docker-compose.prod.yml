# Production Compose overlay for Career Assistant
#
# Usage:
#   docker compose -f docker-compose.yml -f deploy/production/docker-compose.prod.yml up -d
#
# All service ports bound to loopback only, except frontend HTTPS.

services:
  mysql:
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --port 6379
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 512M

  minio:
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 2G

  backend:
    image: career-assistant-backend@sha256:${BACKEND_DIGEST}
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: mysql+pymysql://app:${DB_PASSWORD}@mysql:3306/career_assistant
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS}
      RATE_LIMIT_HMAC_SECRET: ${RATE_LIMIT_HMAC_SECRET}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    user: "1000:1000"

  frontend:
    image: career-assistant-frontend@sha256:${FRONTEND_DIGEST}
    ports:
      - "443:8443"
    volumes:
      - ./deploy/production/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    user: "1000:1000"

  prometheus:
    image: prom/prometheus@sha256:${PROMETHEUS_DIGEST}
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    user: "65534:65534"

  grafana:
    image: grafana/grafana@sha256:${GRAFANA_DIGEST}
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./deploy/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    user: "472:472"

volumes:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data:
