<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Multi Step 2</title></head>
<body>
<main data-topology="multi" data-step-index="2" data-step-count="2" data-step-nav="true">
  <label>电话 <input data-field-key="phone" name="phone"></label>
  <button type="button" data-action-kind="final" id="final-submit">提交申请</button>
</main>
<script>
document.querySelectorAll("[data-field-key]").forEach(function(el) {
  el.addEventListener("input", function() {
    fetch("/event", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({kind:"field", key:el.getAttribute("data-field-key")})});
  });
});
document.getElementById("final-submit").addEventListener("click", function() {
  fetch("/event", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({kind:"final"})});
});
</script>
</body>
</html>
