<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Readback Mismatch</title></head>
<body>
<main data-topology="single">
  <label>姓名 <input data-field-key="full_name" name="full_name"></label>
  <button type="button" data-action-kind="final" id="final-submit">提交申请</button>
</main>
<script>
var inputEl = document.querySelector("[data-field-key='full_name']");
inputEl.addEventListener("input", function() {
  fetch("/event", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({kind:"field", key:"full_name"})});
  // Reset the value to simulate mismatch
  inputEl.value = "";
});
document.getElementById("final-submit").addEventListener("click", function() {
  fetch("/event", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({kind:"final"})});
});
</script>
</body>
</html>
