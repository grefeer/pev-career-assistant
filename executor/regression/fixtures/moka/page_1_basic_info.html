<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>DJI Moka — 基本信息</title></head>
<body>
<main data-topology="multi" data-step-index="1" data-step-count="6" data-step-nav="true">
  <div class="step-indicator">1 / 6</div>
  <h2>基本信息</h2>
  <form>
    <div class="form-group">
      <label>姓名</label>
      <input type="text" data-field-key="name" name="name" placeholder="请输入姓名">
    </div>
    <div class="form-group">
      <label>性别</label>
      <label><input type="radio" name="gender" value="male"> 男</label>
      <label><input type="radio" name="gender" value="female"> 女</label>
    </div>
    <div class="form-group">
      <label>邮箱</label>
      <input type="email" data-field-key="email" name="email" placeholder="请输入邮箱">
    </div>
    <div class="form-group">
      <label>手机号码</label>
      <input type="tel" data-field-key="phone" name="phone" placeholder="请输入手机号码">
    </div>
    <div class="form-group">
      <label>学校</label>
      <input type="text" data-field-key="school" name="school" placeholder="请输入毕业院校">
    </div>
    <div class="form-group">
      <label>毕业年份</label>
      <select data-field-key="graduation_year" name="graduation_year">
        <option value="">请选择</option>
        <option value="2024">2024</option>
        <option value="2025">2025</option>
        <option value="2026">2026</option>
      </select>
    </div>
  </form>
  <div class="form-actions">
    <button data-action-kind="next">保存并下一步</button>
  </div>
</main>
</body>
</html>
