<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>DJI Moka — 附件上传</title></head>
<body>
<main data-topology="multi" data-step-index="6" data-step-count="6" data-step-nav="true">
  <div class="step-indicator">6 / 6</div>
  <h2>附件上传</h2>
  <form>
    <div class="form-group">
      <label>上传简历</label>
      <input type="file" data-field-key="resume_upload" name="resume" accept=".pdf,.doc,.docx">
      <div class="upload-status"></div>
    </div>
    <div class="form-group">
      <label>上传作品集</label>
      <input type="file" data-field-key="portfolio_upload" name="portfolio" accept=".pdf,.zip">
      <div class="upload-status"></div>
    </div>
  </form>
  <div class="form-actions">
    <button data-action-kind="save">保存草稿</button>
    <button data-action-kind="next">下一步</button>
  </div>
</main>
</body>
</html>
