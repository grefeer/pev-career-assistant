<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>DJI Moka — 技能与证书</title></head>
<body>
<main data-topology="multi" data-step-index="5" data-step-count="6" data-step-nav="true">
  <div class="step-indicator">5 / 6</div>
  <h2>技能与证书</h2>
  <form>
    <div class="form-group">
      <label>技能</label>
      <div data-field-key="skills" class="multi-select">
        <input type="text" placeholder="搜索并选择技能" class="search-input">
        <div role="listbox" class="options">
          <div role="option" data-value="Python">Python</div>
          <div role="option" data-value="Java">Java</div>
          <div role="option" data-value="Rust">Rust</div>
          <div role="option" data-value="SQL">SQL</div>
        </div>
      </div>
    </div>
    <div class="form-group">
      <label>证书</label>
      <input type="text" data-field-key="certifications" name="certifications" placeholder="请输入持有的证书">
    </div>
  </form>
  <div class="form-actions">
    <button data-action-kind="next">保存并下一步</button>
  </div>
</main>
</body>
</html>
