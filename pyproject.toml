[tool.ruff]
extend-exclude = []

[tool.ruff.lint]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/manual/*.py" = ["E402"]
"tests/question/*.py" = ["E402"]

[tool.pytest.ini_options]
norecursedirs = [".worktrees", "manual"]

# ---------------------------------------------------------------------------
# Coverage: 100% on RETAINED production packages only.
#
# The ``domain/*`` modules omitted below are pre-PEV paths retained solely
# for ``StrEnum`` imports consumed by ``db/models.py``; their transition/
# helper functions are vestigial and slated for retirement in sub-project 4
# ("Legacy Retirement and Portfolio"). Retained production packages (api,
# config, db.session/base, domain.agent_runtime, domain.profiles,
# middleware, main, repositories, services.agent_runtime,
# services.career_skills, services.{auth,profiles,rate_limit,storage,
# profile_parser}, services.job_discovery.{schemas,tools.jd_extraction})
# remain measured and must stay at 100%.
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
omit = [
  "backend/app/domain/job_submissions.py",
  "backend/app/domain/personalized_discovery.py",
  "backend/app/domain/application_tracking.py",
  "backend/app/domain/company_research.py",
  "backend/app/domain/interview_prep.py",
  "backend/app/domain/job_feedback.py",
  "backend/app/domain/preferences.py",
]

[tool.coverage.report]
fail_under = 100
show_missing = true

