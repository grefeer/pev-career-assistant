[tool.ruff]
extend-exclude = []

[tool.ruff.lint]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/manual/*.py" = ["E402"]
"tests/question/*.py" = ["E402"]

[tool.pytest.ini_options]
norecursedirs = [".worktrees", "manual"]

# ---------------------------------------------------------------------------
# Coverage: 100% on RETAINED production packages only.
#
# Retained production packages (api, config, db.session/base,
# domain.agent_runtime, domain.enums, domain.profiles, middleware, main,
# repositories, services.agent_runtime, services.career_skills,
# services.{auth,profiles,rate_limit,storage,profile_parser},
# services.job_discovery.{schemas,tools.jd_extraction}) remain measured and
# must stay at 100%.
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
omit = []

[tool.coverage.report]
fail_under = 100
show_missing = true

